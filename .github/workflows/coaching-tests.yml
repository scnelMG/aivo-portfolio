name: Coaching tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coaching:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-fastapi-main/requirements-coaching-test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install "torch>=2.13,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend-fastapi-main/requirements-coaching-test.txt
      - name: Run public coaching regression tests
        env:
          PYTHONPATH: backend-fastapi-main/models/filer/src
        run: python -m pytest backend-fastapi-main/tests/coaching -q --junitxml=coaching-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coaching-test-results
          path: coaching-tests.xml
